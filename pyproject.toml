[project]
name = "cropval"
version = "0.1.0"
description = "How much does a random split overstate crop-type mapping accuracy? Spatial validation on smallholder fields in western Kenya."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "rasterio>=1.3",
  "geopandas>=0.14",
  "shapely>=2.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "torch>=2.2",
  "matplotlib>=3.8",
  "tqdm>=4.66",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cropval = "cropval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cropval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# CPU-only PyTorch: the models here are small, and this avoids a multi-gigabyte CUDA download.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
